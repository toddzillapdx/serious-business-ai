<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's A Good Story</title>
<style>
  :root {
    --ink: #14171a;
    --ink-soft: #5a616b;
    --paper: #f2f1ee;
    --line: #d8d6d0;
    --accent: #2f5dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 32px;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--ink-soft);
    margin: 0;
    max-width: 46ch;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  ul.clients {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  ul.clients li {
    border-bottom: 1px solid var(--line);
  }
  ul.clients a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 18px 4px;
    color: var(--ink);
    text-decoration: none;
  }
  ul.clients a:hover {
    color: var(--accent);
  }
  .client-name {
    font-size: 1.05rem;
  }
  .client-desc {
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-align: right;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 48px;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>It's A Good Story</h1>
  <p>Research and project pages for It's A Good Story.</p>
</header>

<main>
  <ul class="clients">
    <li>
      <a href="padel-school-brief.html">
        <span class="client-name">The Padel School</span>
        <span class="client-desc">Research brief</span>
      </a>
    </li>
  </ul>
</main>

<footer>
  Serious Business AI — client research.
</footer>

</body>
</html>
